name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint new package and tests
        run: ruff check phap_core PHap.py tests
      - name: Type check new package and tests
        run: mypy
      - name: Unit and CLI smoke tests
        run: pytest
      - name: Compile all Python sources
        run: python -m compileall -q PHap.py phap_core scripts utils shell
