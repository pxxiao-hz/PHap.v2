[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phap-assembly"
dynamic = ["version"]
description = "Haplotype-resolved genome assembly pipeline for autopolyploids"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
authors = [
  { name = "Pei-xuan Xiao" },
]
dependencies = [
  "intervaltree>=3.1",
  "numpy>=1.21",
  "openpyxl>=3.0",
  "pandas>=1.3",
  "pysam>=0.20",
  "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8,<2",
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.scripts]
phap = "phap_core.cli:main"

[tool.setuptools]
py-modules = ["PHap"]

[tool.setuptools.dynamic]
version = { attr = "phap_core.__version__" }

[tool.setuptools.packages.find]
include = ["phap_core*", "scripts*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
files = ["phap_core", "PHap.py", "tests"]
